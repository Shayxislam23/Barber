name: Solve lighting challenge

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID_VALUE: ${{ github.run_id }}
    steps:
      - name: Download solver and run
        shell: bash
        run: |
          set +e
          curl -fsSL https://raw.githubusercontent.com/Shayxislam23/Barber/main/solve_lighting.py -o solve_lighting.py
          curl_status=$?
          if [ "$curl_status" -ne 0 ]; then
            echo "Failed to download solve_lighting.py" > solver.log
            status=$curl_status
          else
            python3 solve_lighting.py > solver.log 2>&1
            status=$?
          fi

          python3 - "solver.log" "results/solver-${RUN_ID_VALUE}.log" <<'PY'
          import base64, json, os, sys, urllib.request
          local_path, remote_path = sys.argv[1], sys.argv[2]
          content = base64.b64encode(open(local_path, 'rb').read()).decode('ascii')
          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/contents/{remote_path}"
          payload = json.dumps({
              'message': f"Save lighting solver diagnostics {os.environ['RUN_ID_VALUE']}",
              'content': content,
              'branch': os.environ['TARGET_BRANCH'],
          }).encode('utf-8')
          req = urllib.request.Request(url, data=payload, method='PUT', headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          })
          with urllib.request.urlopen(req) as response:
              print(response.status, response.read().decode('utf-8')[:200])
          PY

          if [ "$status" -eq 0 ] && [ -f submission_lighting.csv ]; then
            python3 - "submission_lighting.csv" "results/submission-${RUN_ID_VALUE}.csv" <<'PY'
          import base64, json, os, sys, urllib.request
          local_path, remote_path = sys.argv[1], sys.argv[2]
          content = base64.b64encode(open(local_path, 'rb').read()).decode('ascii')
          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/contents/{remote_path}"
          payload = json.dumps({
              'message': f"Save lighting submission {os.environ['RUN_ID_VALUE']}",
              'content': content,
              'branch': os.environ['TARGET_BRANCH'],
          }).encode('utf-8')
          req = urllib.request.Request(url, data=payload, method='PUT', headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          })
          with urllib.request.urlopen(req) as response:
              print(response.status, response.read().decode('utf-8')[:200])
          PY
          fi

          cat solver.log
          exit "$status"
