name: Solve lighting challenge

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run solver
        run: python solve_lighting.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: submission-lighting
          path: submission_lighting.csv
