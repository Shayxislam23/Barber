name: Solve lighting challenge

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run solver
        id: solver
        continue-on-error: true
        run: |
          set -o pipefail
          python solve_lighting.py 2>&1 | tee solver.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighting-diagnostics
          path: solver.log
      - name: Upload submission
        if: steps.solver.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: submission-lighting
          path: submission_lighting.csv
      - name: Fail job when solver failed
        if: steps.solver.outcome != 'success'
        run: exit 1
